<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오프라인 상태</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: grid; place-items: center; min-height: 100vh; }
      main { max-width: 420px; padding: 24px; text-align: center; }
      h1 { margin-bottom: 8px; }
      p { line-height: 1.5; color: #cbd5e1; }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷 연결이 없습니다</h1>
      <p>네트워크 연결 후 다시 시도해주세요. 저장된 정적 리소스는 오프라인에서도 사용할 수 있습니다.</p>
    </main>
  </body>
</html>
