<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tichu Starter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Realtime Web Game</p>
          <h1>Tichu Starter</h1>
        </div>
        <div id="connectionStatus" class="status-pill">연결 대기</div>
      </header>

      <main class="game-layout">
        <section id="joinPanel" class="panel join-panel" aria-labelledby="joinTitle">
          <div>
            <h2 id="joinTitle">방 입장</h2>
            <p>닉네임과 방 ID를 입력한 뒤 같은 방에 4명이 모이면 카드가 배분됩니다.</p>
          </div>
          <div class="join-form">
            <label>
              닉네임
              <input id="playerName" placeholder="닉네임" value="Player" />
            </label>
            <label>
              방 ID
              <input id="roomId" placeholder="예: room1" value="room1" />
            </label>
            <button id="joinBtn" type="button">입장</button>
          </div>
        </section>

        <section class="panel table-panel" aria-labelledby="tableTitle">
          <div class="panel-title-row">
            <h2 id="tableTitle">테이블</h2>
            <span id="turnInfo" class="turn-badge">턴 정보 없음</span>
          </div>
          <div id="tableCard" class="table-card">아직 카드 없음</div>
        </section>

        <section class="panel players-panel" aria-labelledby="playersTitle">
          <h2 id="playersTitle">플레이어</h2>
          <ul id="players" class="players-list"></ul>
        </section>

        <section class="panel hand-panel" aria-labelledby="handTitle">
          <div class="panel-title-row">
            <h2 id="handTitle">내 카드</h2>
            <div class="action-row">
              <button id="tichuBtn" type="button" class="secondary-action">티츄</button>
              <button id="doubleTichuBtn" type="button" class="secondary-action">더블</button>
              <button id="passBtn" type="button" class="secondary-action">패스</button>
            </div>
          </div>
          <div id="hand" class="hand"></div>
        </section>

        <section class="panel chat-panel" aria-labelledby="chatTitle">
          <h2 id="chatTitle">채팅</h2>
          <div id="chat" class="chat-log" aria-live="polite"></div>
          <div class="chat-row">
            <input id="chatInput" placeholder="메시지" />
            <button id="chatSend" type="button">전송</button>
          </div>
        </section>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
